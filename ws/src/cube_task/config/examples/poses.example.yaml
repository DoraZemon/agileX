# config/site/poses.yaml 的格式。正常由 teach_poses 写（拖动示教），只有工具用不了时才照这个手写。
# 坐标都在基座坐标系（x 向前、y 向左、z 向上），单位 m / rad。这里的数值是官方物料仿真布局 A
# 的例子：3 张 200 × 200 mm 平铺卡纸（无围边），实际位置以现场示教为准。
robot:
  poses:
    # 观察位的 6 个关节角 (rad)。比赛只有腕端相机（eye_in_hand）：相机要看到整个取物区。
    observe_joints: [0.0, 0.486, -0.47, 0.0, 1.168, 0.0]
zones:
  zone_green:  {center: [0.19, 0.30, 0.0], size: [0.20, 0.20], yaw: 0.0, wall_height: 0.0}
  zone_yellow: {center: [0.49, 0.0, 0.0], size: [0.20, 0.20], yaw: 0.0, wall_height: 0.0}
  zone_red:    {center: [0.19, -0.30, 0.0], size: [0.20, 0.20], yaw: 0.0, wall_height: 0.0}
perception:
  roi:
    # 取物区：桌面上放物体的范围，按顺序的角点 [x, y]。不要包含放置区域。
    pick_polygon: [[0.15, -0.175], [0.365, -0.175], [0.365, 0.175], [0.15, 0.175]]
  table:
    # 桌面在基座坐标系里的高度（基座装在桌面上时约为 0）。也是抓取高度和安全检查桌面高度的下限
    expected_z: 0.0
