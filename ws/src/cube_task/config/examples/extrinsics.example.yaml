# 复制成 config/site/extrinsics.yaml，换成官方标定结果。这里的数值只是例子
# （仿真里的固定相机：在基座前方 0.70 m、高 0.62 m，向下看取物区）。
#
# matrix 把相机坐标（彩色光学坐标系：x 右、y 下、z 朝前）变到 parent_frame：p_parent = matrix @ p_camera，单位 m。
#   eye_to_hand（固定相机）：parent_frame base   -> T_base_camera
#   eye_in_hand（腕部相机）：parent_frame flange -> T_flange_camera（法兰 = link6）。相对 TCP 的外参写
#     parent_frame tcp，并且必须加 tcp_offset: [x, y, z, roll, pitch, yaw]（m, rad，标定时驱动用的 TCP 偏移）
# 官方给的是反方向（基座 -> 相机）时，把 matrix 换成键名 T_camera_base，加载时自动求逆。
# 也可以写 translation + quaternion (x, y, z, w)，或 xyz + rpy / rpy_deg（R = Rz Ry Rx）。
# rpy 是弧度（绝对值大于 2π 拒绝加载），度写 rpy_deg。
# child_frame 必须以 _optical_frame 结尾；官方给的是 camera_link 时写 child_frame: camera_link，再加
# T_link_optical（ros2 run tf2_ros tf2_echo camera_link camera_color_optical_frame 打印的 4x4）。
# 同时写几种时它们必须一致；手改其中一种就删掉其他的。格式说明见 docs/配置说明.md 第 4 节。
mount: eye_to_hand
parent_frame: base
child_frame: camera_color_optical_frame
matrix:
  - [0.0000,  0.8403, -0.5421, 0.7000]
  - [1.0000,  0.0000,  0.0000, 0.0000]
  - [0.0000, -0.5421, -0.8403, 0.6200]
  - [0.0000,  0.0000,  0.0000, 1.0000]
source: example_only
