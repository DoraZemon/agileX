# 现场颜色阈值（11/12 调试工位大白相机实拍），覆盖 default.yaml 的 perception.classifier.color.classes。
# OpenCV HSV：H 0-180，S / V 0-255。量得：红方块顶面 H 154-166（偏玫红）、侧面 170-5；
# 黄方块顶面 H 40-51、S 55-77；绿方块 H 64-83。旧范围里黄色只到 H 34、S >= 90，黄方块落进了绿色。
# 换场地或灯光后用 tools/color_calib 重新标（会覆盖本文件，旧文件备份）。
perception:
  classifier:
    color:
      classes:
        red:    [[[0, 70, 60], [10, 255, 255]], [[150, 70, 60], [180, 255, 255]]]
        orange: [[[11, 110, 80], [17, 255, 255]]]
        yellow: [[[18, 45, 90], [57, 255, 255]]]
        green:  [[[58, 45, 40], [95, 255, 255]]]
        blue:   [[[96, 90, 40], [130, 255, 255]]]
        purple: [[[131, 50, 40], [149, 255, 255]]]
